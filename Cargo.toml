[package]
name = "zsolv"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bip39 = "2"
blake2b_simd = "1.0.5"
clap = { version = "4.6.7", features = ["derive", "env"] }
hex = "0.4.3"
prost = "0.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiny_http = "0.12.0"
tokio = { version = "1.54.1", features = ["rt", "macros"] }
tonic = { version = "0.14", features = ["tls-ring", "tls-webpki-roots"] }
tonic-prost = "0.14"
ureq = "2"
voting-circuits = "0.14.0"
voting-crypto-deps = "=0.4.0"
